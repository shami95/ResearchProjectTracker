# ===== Server =====
server.port=8081

# ===== MySQL Datasource =====
# IMPORTANT: update username/password below to match YOUR local MySQL setup.
# Create the database first with:  CREATE DATABASE research_tracker;
spring.datasource.url=jdbc:mysql://localhost:3306/research_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# 256-bit secret used to sign tokens (already generated for you - change for production use)
jwt.secret=747fb14d313a322f81c80271e3e47eafc765b5129aa07884527ed12b4b60e024
# Token validity in milliseconds (currently 24 hours)
jwt.expiration=86400000

# ===== File uploads (Documents) =====
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Logging =====
logging.level.org.springframework.security=INFO
